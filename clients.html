<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clients | Creative Stone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ============ NAV ============ -->
<!-- Same header, burger and drawer as index.html — script.js drives all three
     off #siteHeader/#navToggle, so this page gets them by carrying the same
     markup. The section links point back at index.html's anchors; "clients" is
     this page and stays in the list so the nav never loses an item mid-site. -->
<header id="siteHeader" style="position: fixed; top: 0; left: 0; right: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between; height: 74px; padding: 0 40px; background: rgba(10, 10, 12, 0.72); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid #1c1c20;">
  <a href="index.html" style="display: flex; align-items: center;">
    <img src="assets/logo.svg" alt="Creative Stone" style="height: 34px; width: auto; display: block;">
  </a>
  <div style="display: flex; align-items: center; gap: 10px;">
    <nav style="display: flex; align-items: center; gap: 0; overflow: hidden;">
      <a href="index.html#services" class="btn-outline nav-item" style="width: 150px; font-size: 20px; font-weight: 600; transition-delay: 0.18s;">
        <span class="nav-slide-label nav-slide-original">services</span>
        <span class="nav-slide-label nav-slide-duplicate">services</span>
      </a>
      <a href="index.html#industries" class="btn-outline nav-item" style="width: 170px; font-size: 20px; font-weight: 600; transition-delay: 0.12s;">
        <span class="nav-slide-label nav-slide-original">industries</span>
        <span class="nav-slide-label nav-slide-duplicate">industries</span>
      </a>
      <a href="clients.html" class="btn-outline nav-item" style="width: 135px; font-size: 20px; font-weight: 600; transition-delay: 0.06s;">
        <span class="nav-slide-label nav-slide-original">clients</span>
        <span class="nav-slide-label nav-slide-duplicate">clients</span>
      </a>
      <a href="plans.html" class="btn-outline nav-item" style="width: 135px; font-size: 20px; font-weight: 600; transition-delay: 0s;">
        <span class="nav-slide-label nav-slide-original">pricing</span>
        <span class="nav-slide-label nav-slide-duplicate">pricing</span>
      </a>
    </nav>
    <button id="navToggle" aria-expanded="false" aria-label="Toggle menu" style="background: none; border: none; cursor: pointer; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px; width: 44px; height: 44px; padding: 0; flex-shrink: 0;">
      <span class="burger-line"></span>
      <span class="burger-line"></span>
      <span class="burger-line"></span>
    </button>
  </div>
</header>

<!-- ============ CLIENTS ============ -->
<main class="clients-page">
  <h1 class="clients-page__title">Clients</h1>

  <div class="clients-list">
      <a class="client-row client-row--link reveal" href="aharon-berk.html" style="animation-delay: 0.00s;" aria-label="Aharon Berk case study">
        <figure class="client-row__media noise-spot">
          <img src="assets/portfolio/01-aharon-berk-laptop.jpg" alt="Aharon Berk site on a laptop" loading="lazy" decoding="async">
        </figure>
        <div class="client-row__label">
          <span class="client-row__arrows" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13"/><path d="m12 5 7 7-7 7"/></svg>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13"/><path d="m12 5 7 7-7 7"/></svg>
          </span>
          <h2 class="client-row__name">Aharon<br>Berk</h2>
        </div>
      </a>
      <article class="client-row reveal" style="animation-delay: 0.06s;">
        <figure class="client-row__media noise-spot">
          <img src="assets/portfolio/03-rowsone-digital.jpg" alt="RowsOne digital experience" loading="lazy" decoding="async">
        </figure>
        <div class="client-row__label">
          <span class="client-row__arrows" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13"/><path d="m12 5 7 7-7 7"/></svg>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13"/><path d="m12 5 7 7-7 7"/></svg>
          </span>
          <h2 class="client-row__name">Rows<br>One</h2>
        </div>
      </article>
      <article class="client-row reveal" style="animation-delay: 0.00s;">
        <figure class="client-row__media noise-spot">
          <img src="assets/portfolio/07-globaltech-banner.jpg" alt="GlobalTech trade show banner" loading="lazy" decoding="async">
        </figure>
        <div class="client-row__label">
          <span class="client-row__arrows" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13"/><path d="m12 5 7 7-7 7"/></svg>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13"/><path d="m12 5 7 7-7 7"/></svg>
          </span>
          <h2 class="client-row__name">Global<br>Tech</h2>
        </div>
      </article>
  </div>
</main>

<footer style="border-top: 1px solid #1c1c20; padding: 40px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 20px 28px;">
  <nav style="display: flex; gap: 28px; font-size: 14px;">
    <a href="index.html#services" style="color: #8a8a92;">services</a>
    <a href="index.html#industries" style="color: #8a8a92;">industries</a>
    <a href="plans.html" style="color: #8a8a92;">pricing</a>
    <a href="index.html#contact" style="color: #8a8a92;">contact</a>
  </nav>
  <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #55555c;">&copy; 2026 Creative Stone. All rights reserved.</span>
</footer>

<script src="script.js"></script>
</body>
</html>
